name: WorkoutLog
options:
  bundleIdPrefix: com.kenneth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  WorkoutLog:
    type: application
    platform: iOS
    sources:
      - WorkoutLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenneth.workoutlog
        INFOPLIST_FILE: WorkoutLog/Info.plist
        CODE_SIGN_ENTITLEMENTS: WorkoutLog/WorkoutLog.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: WorkoutLog/WorkoutLog.entitlements
